name: Sync HubSpot → data.json

on:
  schedule:
    # Roda todo dia às 11:00 UTC (08:00 BRT)
    - cron: '0 11 * * *'
  workflow_dispatch: # permite rodar manualmente pelo GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # precisa pra commitar o data.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch HubSpot data
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: node scripts/fetch.js

      - name: Commit & push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # Só commita se houve mudança
          git diff --staged --quiet || git commit -m "🔄 Atualiza data.json — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
