name: Sync dados (HubSpot + Lemlist)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch HubSpot data
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: node fetch.js

      - name: Fetch Lemlist data
        env:
          LEMLIST_API_KEY: ${{ secrets.LEMLIST_API_KEY }}
        run: node fetch-lemlist.js

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json lemlist-data.json
          git diff --staged --quiet || git commit -m "🔄 Sync dados — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
