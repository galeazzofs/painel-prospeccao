<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Campanhas Lemlist · Painel Executivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#FAFAF9;--surface:#FFF;--surface-2:#F5F5F4;--border:#E7E5E4;--border-strong:#D6D3D1;--text-1:#0C0A09;--text-2:#44403C;--text-3:#78716C;--text-4:#A8A29E;--accent:#1F5F3F;--accent-dark:#0F3D28;--accent-soft:#E8F2EC;--positive:#15803D;--positive-soft:#F0FDF4;--negative:#991B1B;--negative-soft:#FEF2F2;--warning:#92400E;--warning-soft:#FEF3C7;--shadow-sm:0 1px 2px rgba(12,10,9,.04)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text-1);font-family:'Geist',-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:400;letter-spacing:-.02em}
.mono{font-family:'Geist Mono',monospace}
.app{max-width:1320px;margin:0 auto;padding:32px 40px 80px}
.state-screen{min-height:60vh;display:grid;place-items:center;text-align:center}
.state-screen .title{font-family:'Fraunces',serif;font-size:28px;color:var(--text-2);margin-bottom:8px}
.state-screen .sub{color:var(--text-3);font-size:14px}
.spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 20px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.retry-btn{margin-top:16px;background:var(--text-1);color:#fff;border:none;padding:10px 18px;border-radius:6px;font-family:inherit;font-size:13px;cursor:pointer}
.topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:28px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap;gap:16px}
.brand{display:flex;align-items:baseline;gap:14px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:inline-grid;place-items:center;color:#fff;font-weight:600;font-size:13px;transform:translateY(4px)}
.brand-title{font-size:15px;font-weight:500;letter-spacing:-.01em}
.brand-sub{font-size:13px;color:var(--text-3)}
.topbar-right{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--text-3)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--positive);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.nav-link{color:var(--text-3);text-decoration:none;font-size:12px;border:1px solid var(--border);padding:6px 10px;border-radius:6px;white-space:nowrap}
.nav-link:hover{color:var(--text-1);border-color:var(--border-strong)}
.fade-in{animation:fadeUp .35s cubic-bezier(.4,0,.2,1) backwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.section-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;margin-top:40px;flex-wrap:wrap;gap:8px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);font-weight:500}
.section-sub{font-size:12px;color:var(--text-4)}

/* Filter */
.filter-bar{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-sm);margin-bottom:20px;flex-wrap:wrap}
.filter-label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:500;white-space:nowrap}
.filter-pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{padding:7px 14px;font-size:13px;font-family:inherit;color:var(--text-3);background:transparent;border:none;border-radius:7px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:8px}
.pill:hover{background:var(--surface-2);color:var(--text-2)}
.pill.active{background:var(--text-1);color:#fff}
.pill .pill-count{font-size:11px;opacity:.6}

/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 22px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.kpi:hover{border-color:var(--border-strong)}
.kpi-label{font-size:12px;color:var(--text-3)}
.kpi-value{font-size:32px;letter-spacing:-.03em;line-height:1}
.kpi-sub{font-size:12px;color:var(--text-3)}
.kpi-bar{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:4px}
.kpi-bar-fill{height:100%;border-radius:2px;transition:width .6s}
.kpi-bench{font-size:10px;color:var(--text-4);margin-top:2px;display:flex;align-items:center;gap:4px}
.kpi-bench .dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}

/* Comparison */
.compare-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:28px;box-shadow:var(--shadow-sm)}
.compare-grid{display:flex;flex-direction:column;gap:22px}
.compare-row{display:grid;grid-template-columns:90px 1fr;gap:16px;align-items:start}
.compare-metric{font-size:12px;color:var(--text-2);font-weight:500;padding-top:4px}
.compare-bars{display:flex;flex-direction:column;gap:6px}
.compare-bar-row{display:flex;align-items:center;gap:10px;height:22px}
.compare-bar-label{font-size:11px;color:var(--text-3);width:80px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compare-bar-track{flex:1;height:18px;background:var(--surface-2);border-radius:4px;position:relative;overflow:visible}
.compare-bar-fill{height:100%;border-radius:4px;transition:width .6s;min-width:2px}
.compare-bar-val{font-size:11px;font-weight:600;color:var(--text-2);margin-left:8px;white-space:nowrap;flex-shrink:0}
.compare-bench{position:absolute;top:-2px;bottom:-2px;width:2px;border-radius:1px;z-index:2;opacity:.7}
.compare-bench::after{content:attr(data-label);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;white-space:nowrap;color:var(--text-4)}
.compare-legend{display:flex;gap:20px;font-size:11px;color:var(--text-3);margin-top:16px;flex-wrap:wrap}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:6px}

/* Funnel */
.funnel-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:28px;box-shadow:var(--shadow-sm)}
.funnel-row{display:grid;grid-template-columns:120px 1fr 60px 50px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.funnel-row:last-child{border-bottom:none}
.funnel-row.header{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);font-weight:500;padding:0 0 8px;border-bottom:1px solid var(--border-strong)}
.funnel-name{font-size:13px;color:var(--text-2);font-weight:500}
.funnel-bar-wrap{height:22px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.funnel-bar-fill{height:100%;border-radius:5px;transition:width .7s}
.funnel-count{font-size:13px;font-weight:600;text-align:right}
.funnel-pct{font-size:11px;color:var(--text-3);text-align:right}
.funnel-drop{font-size:10px;color:var(--text-4);text-align:center;padding:4px 0}

/* Tables */
.dual-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px 26px;box-shadow:var(--shadow-sm)}
.card-title{font-size:13px;font-weight:500;margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text-3);margin-bottom:20px}
table.perf{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px}
table.perf th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--border)}
table.perf th:last-child,table.perf td:last-child{text-align:right}
table.perf td{padding:12px;border-bottom:1px solid var(--border);color:var(--text-2)}
table.perf tr:last-child td{border-bottom:none}
table.perf tr:hover td{background:var(--surface-2)}
.perf-mini-bar{display:inline-block;width:48px;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;vertical-align:middle;margin-right:8px}
.perf-mini-bar-fill{height:100%;background:var(--accent);border-radius:2px}
.empty-row td{color:var(--text-4);text-align:center;padding:24px;font-size:12px}
.badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;margin-left:6px;vertical-align:middle}
.badge.good{background:var(--positive-soft);color:var(--positive)}
.badge.warn{background:var(--warning-soft);color:var(--warning)}
.badge.bad{background:var(--negative-soft);color:var(--negative)}

/* Benchmark card */
.bench-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px 26px;box-shadow:var(--shadow-sm)}
.bench-row{display:grid;grid-template-columns:130px 80px 80px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}
.bench-row:last-child{border-bottom:none}
.bench-row.header{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);font-weight:500;padding:4px 0 8px;border-bottom:1px solid var(--border-strong)}
.bench-metric{color:var(--text-2);font-weight:500}
.bench-yours{font-weight:600;font-size:13px}
.bench-ref{color:var(--text-3)}
.bench-verdict{font-size:11px;font-weight:500;padding:3px 8px;border-radius:4px;text-align:center;white-space:nowrap}
.bench-verdict.above{background:var(--positive-soft);color:var(--positive)}
.bench-verdict.at{background:var(--accent-soft);color:var(--accent)}
.bench-verdict.below{background:var(--negative-soft);color:var(--negative)}

.note{margin-top:32px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--text-3)}
.footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:11px;color:var(--text-4);flex-wrap:wrap;gap:8px}
@media(max-width:1100px){.app{padding:24px 20px 60px}.kpi-grid{grid-template-columns:repeat(2,1fr)}.dual-grid{grid-template-columns:1fr}.compare-row{grid-template-columns:80px 1fr}.compare-bar-label{width:60px}}
</style>
</head>
<body>
<div id="root">
  <div class="app"><div class="state-screen"><div class="spinner"></div><div class="title serif">Carregando…</div></div></div>
</div>

<script>
const DASH='—';
const COLORS=['#1F5F3F','#2563EB','#D97706'];

// Benchmarks B2B outbound 2025-2026 (fontes: Instantly, Expandi, Cleverly, Apollo, Belkins)
const BENCH={
  email:{
    deliveryRate:{avg:.92, good:.95, label:'Entrega', src:'Instantly 2026'},
    openRate:{avg:.277, good:.40, label:'Abertura', src:'Instantly/Snov.io 2026'},
    clickRate:{avg:.03, good:.05, label:'Clique', src:'Infraforge/MailerLite'},
    replyRate:{avg:.034, good:.058, label:'Resposta', src:'Instantly 2026 (3.4% avg, 5-8% bom)'},
    bounceRate:{avg:.05, bad:.10, label:'Bounce', src:'Google/Microsoft 2025-2026 (< 2% ideal)'},
  },
  linkedin:{
    acceptanceRate:{avg:.285, good:.40, label:'Aceite conexão', src:'Expandi 2026 (28.5% avg, 30-45% bom)'},
    replyRate:{avg:.10, good:.15, label:'Resposta msg', src:'Expandi 2026 (10.4% avg)'},
  }
};

let gData=null, gConfig=null;
let F={campaign:'all'};

function isNil(v){return v===null||v===undefined}
function fmt(v,t='auto'){
  if(isNil(v))return DASH;
  switch(t){case 'int':return Number(v).toLocaleString('pt-BR');case 'pct':return`${(v*100).toFixed(1).replace('.',',')}%`;case 'pct0':return`${(v*100).toFixed(0)}%`;default:return String(v)}
}
function fmtDate(iso){if(!iso)return DASH;const d=new Date(iso),m=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];return`${String(d.getDate()).padStart(2,'0')} ${m[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function timeAgo(iso){if(!iso)return DASH;const min=Math.floor((Date.now()-new Date(iso).getTime())/60000);if(min<1)return'agora';if(min<60)return`há ${min} min`;const h=Math.floor(min/60);if(h<24)return`há ${h} h`;return`há ${Math.floor(h/24)} d`}

function totals(campaigns){
  const t={leads:0,reached:0,answered:0,interested:0,interrupted:0,sent:0,delivered:0,bounced:0,opened:0,clicked:0,replied:0,invitesSent:0,invitesAccepted:0,liSent:0,liReplied:0,meetings:0};
  for(const c of campaigns){
    t.leads+=c.leads.total;t.reached+=c.leads.reached;t.answered+=c.leads.answered;
    t.interested+=c.leads.interested;t.interrupted+=c.leads.interrupted;
    t.sent+=c.email.sent;t.delivered+=c.email.delivered;t.bounced+=c.email.bounced;
    t.opened+=c.email.opened;t.clicked+=c.email.clicked;t.replied+=c.email.replied;
    t.invitesSent+=c.linkedin.invitesSent;t.invitesAccepted+=c.linkedin.invitesAccepted;
    t.liSent+=c.linkedin.messagesSent;t.liReplied+=c.linkedin.messagesReplied;
    t.meetings+=c.meetingBooked;
  }
  return t;
}

function filtered(){
  const all=gData.campaigns||[];
  if(F.campaign==='all')return all;
  return all.filter(c=>c.id===F.campaign);
}

function verdictFor(yours, bench){
  if(bench.bad!==undefined){return yours>bench.bad?'below':yours<=bench.avg?'above':'at'}
  if(yours>=bench.good)return'above';if(yours>=bench.avg)return'at';return'below';
}
function verdictLabel(v){return v==='above'?'Acima':'at'===v?'Na média':'Abaixo'}

// ---- RENDERERS -----------------------------------------------------------

function renderTopbar(){
  return`<div class="topbar fade-in"><div class="brand"><div class="brand-mark">P</div><div><div class="brand-title">Campanhas</div><div class="brand-sub">Lemlist · Pipo Saúde</div></div></div><div class="topbar-right"><a class="nav-link" href="index.html">← Painel de Prospecção</a><span><span class="live-dot"></span>Atualizado ${timeAgo(gData.meta.updatedAt)}</span><span class="mono">${fmtDate(gData.meta.updatedAt)}</span></div></div>`;
}

function renderFilter(){
  const all=gData.campaigns||[];
  const totalLeads=all.reduce((s,c)=>s+c.leads.total,0);
  const pills=[{id:'all',label:'Todas',count:totalLeads},...all.map(c=>({id:c.id,label:c.label,count:c.leads.total}))];
  return`<div class="filter-bar fade-in"><span class="filter-label">Campanha</span><div class="filter-pills">${pills.map(p=>`<button class="pill ${F.campaign===p.id?'active':''}" data-cid="${p.id}">${p.label} <span class="pill-count">${fmt(p.count,'int')}</span></button>`).join('')}</div></div>`;
}

function renderKpis(t){
  const dr=t.sent>0?t.delivered/t.sent:0;
  const br=t.sent>0?t.bounced/t.sent:0;
  const or_=t.delivered>0?t.opened/t.delivered:0;
  const cr=t.delivered>0?t.clicked/t.delivered:0;
  const rr=t.delivered>0?t.replied/t.delivered:0;
  const ar=t.invitesSent>0?t.invitesAccepted/t.invitesSent:0;
  const lr=t.liSent>0?t.liReplied/t.liSent:0;

  function benchNote(yours, bench){
    if(!bench)return'';
    const v=verdictFor(yours,bench);
    const c=v==='above'?'var(--positive)':v==='at'?'var(--accent)':'var(--negative)';
    return`<div class="kpi-bench"><span class="dot" style="background:${c}"></span>${verdictLabel(v)} do bench (${fmt(bench.avg,'pct')})</div>`;
  }

  function kpi(label,value,sub,barPct,barColor,bench,yours){
    const bar=barPct!==null?`<div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.min(100,barPct)}%;background:${barColor||'var(--accent)'}"></div></div>`:'';
    const bn=bench?benchNote(yours,bench):'';
    return`<div class="kpi fade-in"><div class="kpi-label">${label}</div><div class="kpi-value serif">${value}</div><div class="kpi-sub">${sub}</div>${bar}${bn}</div>`;
  }

  return`<div class="kpi-grid" style="margin-top:8px">
    ${kpi('Leads nas campanhas',fmt(t.leads,'int'),`${fmt(t.reached,'int')} alcançados · ${fmt(t.interrupted,'int')} interrompidos`,null,null,null,null)}
    ${kpi('Taxa de entrega',fmt(dr,'pct'),`${fmt(t.delivered,'int')} de ${fmt(t.sent,'int')} · ${fmt(t.bounced,'int')} bounces`,dr*100,'var(--accent)',BENCH.email.deliveryRate,dr)}
    ${kpi('Taxa de abertura',fmt(or_,'pct'),`${fmt(t.opened,'int')} aberturas`,or_*100,'#2563EB',BENCH.email.openRate,or_)}
    ${kpi('Taxa de clique',fmt(cr,'pct'),`${fmt(t.clicked,'int')} cliques`,cr*100,'#7C3AED',BENCH.email.clickRate,cr)}
    ${kpi('Taxa de resposta',fmt(rr,'pct'),`${fmt(t.replied,'int')} respostas`,rr*100,'var(--positive)',BENCH.email.replyRate,rr)}
    ${kpi('Aceite LinkedIn',fmt(ar,'pct'),`${fmt(t.invitesAccepted,'int')} de ${fmt(t.invitesSent,'int')} convites`,ar*100,'#D97706',BENCH.linkedin.acceptanceRate,ar)}
    ${kpi('Resposta pós-conexão',fmt(lr,'pct'),`${fmt(t.liReplied,'int')} de ${fmt(t.liSent,'int')} msgs`,t.liSent>0?lr*100:0,'#D97706',BENCH.linkedin.replyRate,lr)}
    ${kpi('Reuniões agendadas',fmt(t.meetings,'int'),'via Lemlist',null,null,null,null)}
  </div>`;
}

function renderFunnel(t){
  if(t.sent===0) return'';
  const steps=[
    {name:'Enviados',count:t.sent,color:'var(--text-4)'},
    {name:'Entregues',count:t.delivered,color:'var(--accent)'},
    {name:'Abertos',count:t.opened,color:'#2563EB'},
    {name:'Clicados',count:t.clicked,color:'#7C3AED'},
    {name:'Respondidos',count:t.replied,color:'var(--positive)'},
    {name:'Reunião',count:t.meetings,color:'#D97706'},
  ];
  const max=steps[0].count||1;
  let rows='';
  for(let i=0;i<steps.length;i++){
    const s=steps[i], pct=max>0?s.count/max:0;
    const convPct=i>0&&steps[i-1].count>0?s.count/steps[i-1].count:null;
    if(i>0){
      const drop=steps[i-1].count-s.count;
      rows+=`<div class="funnel-drop">↓ ${drop>0?'-'+fmt(drop,'int'):'='}${convPct!==null?' ('+fmt(convPct,'pct')+')':''}</div>`;
    }
    rows+=`<div class="funnel-row"><div class="funnel-name">${s.name}</div><div class="funnel-bar-wrap"><div class="funnel-bar-fill" style="width:${pct*100}%;background:${s.color}"></div></div><div class="funnel-count">${fmt(s.count,'int')}</div><div class="funnel-pct">${i===0?'':fmt(pct,'pct')}</div></div>`;
  }
  return`<div class="section-header"><div class="section-title">Funil de conversão email</div><div class="section-sub">Do envio até a reunião</div></div><div class="funnel-card fade-in"><div class="funnel-row header"><div>Etapa</div><div>Volume</div><div style="text-align:right">Abs</div><div style="text-align:right">%</div></div>${rows}</div>`;
}

function renderCompare(){
  const all=gData.campaigns||[];
  if(all.length<2||F.campaign!=='all')return'';

  const metrics=[
    {label:'Entrega', get:c=>c.email.deliveryRate, bench:BENCH.email.deliveryRate.avg},
    {label:'Abertura', get:c=>c.email.openRate, bench:BENCH.email.openRate.avg},
    {label:'Clique', get:c=>c.email.clickRate, bench:BENCH.email.clickRate.avg},
    {label:'Resposta', get:c=>c.email.replyRate, bench:BENCH.email.replyRate.avg},
    {label:'Aceite LI', get:c=>c.linkedin.acceptanceRate, bench:BENCH.linkedin.acceptanceRate.avg},
    {label:'Resp. LI', get:c=>c.linkedin.replyRate, bench:BENCH.linkedin.replyRate.avg},
  ];

  const rows=metrics.map(m=>{
    const vals=all.map(c=>m.get(c));
    const maxScale=Math.max(...vals, m.bench, 0.001)*1.2;
    const benchPct=(m.bench/maxScale)*100;
    const bars=all.map((c,i)=>{
      const v=vals[i];
      const w=(v/maxScale)*100;
      return`<div class="compare-bar-row">
        <div class="compare-bar-label">${c.label}</div>
        <div class="compare-bar-track">
          <div class="compare-bar-fill" style="width:${Math.max(w,1)}%;background:${COLORS[i]}"></div>
          <div class="compare-bench" style="left:${benchPct}%;background:var(--text-1)" data-label="bench"></div>
        </div>
        <div class="compare-bar-val">${fmt(v,'pct')}</div>
      </div>`;
    }).join('');
    return`<div class="compare-row"><div class="compare-metric">${m.label}</div><div class="compare-bars">${bars}</div></div>`;
  }).join('');

  const legend=all.map((c,i)=>`<span><span class="legend-dot" style="background:${COLORS[i]}"></span>${c.label}</span>`).join('');

  return`<div class="section-header"><div class="section-title">Comparativo entre campanhas</div><div class="section-sub">Barras = suas taxas · Linha vertical = benchmark outbound B2B 2026</div></div>
  <div class="compare-card fade-in"><div class="compare-grid">${rows}</div><div class="compare-legend" style="margin-top:20px">${legend}<span><span class="legend-dot" style="background:var(--text-1);width:3px;height:12px;border-radius:1px"></span>Benchmark B2B</span></div></div>`;
}

function renderBenchmarkTable(t){
  const dr=t.sent>0?t.delivered/t.sent:0;
  const or_=t.delivered>0?t.opened/t.delivered:0;
  const cr=t.delivered>0?t.clicked/t.delivered:0;
  const rr=t.delivered>0?t.replied/t.delivered:0;
  const br=t.sent>0?t.bounced/t.sent:0;
  const ar=t.invitesSent>0?t.invitesAccepted/t.invitesSent:0;
  const lr=t.liSent>0?t.liReplied/t.liSent:0;

  const rows=[
    {label:'Entrega email', yours:dr, bench:BENCH.email.deliveryRate},
    {label:'Bounce', yours:br, bench:BENCH.email.bounceRate, invert:true},
    {label:'Abertura', yours:or_, bench:BENCH.email.openRate},
    {label:'Clique', yours:cr, bench:BENCH.email.clickRate},
    {label:'Resposta email', yours:rr, bench:BENCH.email.replyRate},
    {label:'Aceite LinkedIn', yours:ar, bench:BENCH.linkedin.acceptanceRate},
    {label:'Resposta LinkedIn', yours:lr, bench:BENCH.linkedin.replyRate},
  ];

  const html=rows.map(r=>{
    let v;
    if(r.invert){v=r.yours<=r.bench.avg?'above':r.yours>=(r.bench.bad||r.bench.avg*2)?'below':'at'}
    else{v=verdictFor(r.yours,r.bench)}
    return`<div class="bench-row">
      <div class="bench-metric">${r.label}</div>
      <div class="bench-yours">${fmt(r.yours,'pct')}</div>
      <div class="bench-ref">${fmt(r.bench.avg,'pct')}</div>
      <div><span class="bench-verdict ${v}">${verdictLabel(v)}</span></div>
    </div>`;
  }).join('');

  return`<div class="section-header"><div class="section-title">Benchmark vs mercado</div><div class="section-sub">Comparativo com médias de outbound B2B 2025-2026 (fontes: Instantly, Expandi, Cleverly, Apollo)</div></div>
  <div class="bench-card fade-in">
    <div class="bench-row header"><div>Métrica</div><div>Você</div><div>Mercado</div><div>Status</div></div>
    ${html}
  </div>`;
}

function renderEmailTable(campaigns){
  const maxOpen=Math.max(...campaigns.map(c=>c.email.openRate),0.001);
  const rows=campaigns.length
    ?campaigns.map(c=>{
      const bBounce=c.email.bounceRate>0.15?'<span class="badge bad">bounce alto</span>':'';
      return`<tr>
        <td>${c.label}</td>
        <td>${fmt(c.email.sent,'int')}</td>
        <td>${fmt(c.email.deliveryRate,'pct')}${bBounce}</td>
        <td><span class="perf-mini-bar"><span class="perf-mini-bar-fill" style="width:${(c.email.openRate/maxOpen)*100}%"></span></span>${fmt(c.email.openRate,'pct')}</td>
        <td>${fmt(c.email.clickRate,'pct')}</td>
        <td>${fmt(c.email.replyRate,'pct')}</td>
      </tr>`;
    }).join('')
    :'<tr class="empty-row"><td colspan="6">Nenhuma campanha configurada</td></tr>';
  return`<div class="card fade-in"><div class="card-title">Email — detalhamento</div><div class="card-sub">Entrega, abertura, clique e resposta por campanha</div><table class="perf"><thead><tr><th>Campanha</th><th>Enviados</th><th>Entrega</th><th>Abertura</th><th>Clique</th><th>Resposta</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderLinkedinTable(campaigns){
  const withLi=campaigns.filter(c=>c.linkedin.invitesSent>0);
  const rows=withLi.length
    ?withLi.map(c=>`<tr>
        <td>${c.label}</td>
        <td>${fmt(c.linkedin.invitesSent,'int')}</td>
        <td>${fmt(c.linkedin.acceptanceRate,'pct')}</td>
        <td>${fmt(c.linkedin.invitesAccepted,'int')}</td>
        <td>${fmt(c.linkedin.messagesSent,'int')}</td>
        <td>${fmt(c.linkedin.replyRate,'pct')}${c.linkedin.replyRate>0?'<span class="badge good">✓</span>':''}</td>
      </tr>`).join('')
    :'<tr class="empty-row"><td colspan="6">Nenhuma campanha com atividade no LinkedIn</td></tr>';
  return`<div class="card fade-in"><div class="card-title">LinkedIn — detalhamento</div><div class="card-sub">Convites → aceite → mensagens → resposta</div><table class="perf"><thead><tr><th>Campanha</th><th>Convites</th><th>Aceite</th><th>Aceitos</th><th>Msgs</th><th>Resposta</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderLeadStatus(campaigns){
  const t=totals(campaigns);
  if(t.leads===0)return'';
  const segs=[
    {name:'Alcançados',count:t.reached,color:'var(--accent)'},
    {name:'Responderam',count:t.answered,color:'var(--positive)'},
    {name:'Interessados',count:t.interested,color:'#2563EB'},
    {name:'Interrompidos',count:t.interrupted,color:'var(--negative)'},
  ];
  const max=Math.max(...segs.map(s=>s.count),1);
  const rows=segs.map(s=>`<div style="display:grid;grid-template-columns:100px 1fr 40px;gap:10px;align-items:center;padding:8px 0;font-size:13px"><div style="color:var(--text-2)">${s.name}</div><div style="height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden"><div style="height:100%;width:${(s.count/max)*100}%;background:${s.color};border-radius:5px;transition:width .6s"></div></div><div style="text-align:right;color:var(--text-3);font-size:12px">${fmt(s.count,'int')}</div></div>`).join('');
  return`<div class="card fade-in"><div class="card-title">Status dos leads</div><div class="card-sub">${fmt(t.leads,'int')} leads no total</div>${rows}</div>`;
}

function renderFooter(){
  const total=(gData.campaigns||[]).reduce((s,c)=>s+c.leads.total,0);
  return`<div class="footer"><div>Fonte: Lemlist API · sync GitHub Actions</div><div>Benchmarks: Instantly, Expandi, Apollo, Cleverly — 2025/2026</div><div>${fmt(total,'int')} leads · ${(gData.campaigns||[]).length} campanhas</div></div>`;
}

// ---- MAIN ----------------------------------------------------------------

function render(){
  if(!gData)return;
  const camps=filtered();
  const t=totals(camps);
  const allCamps=gData.campaigns||[];

  document.getElementById('root').innerHTML=`<div class="app">
    ${renderTopbar()}
    <div class="section-header" style="margin-top:0"><div><div class="section-title">Campanhas configuradas</div><div class="section-sub">${allCamps.length} campanhas · ${F.campaign==='all'?'visão consolidada':'filtrando 1 campanha'}</div></div></div>
    ${renderFilter()}
    ${renderKpis(t)}
    ${renderFunnel(t)}
    ${renderCompare()}
    ${renderBenchmarkTable(t)}
    <div class="section-header"><div class="section-title">Detalhamento por canal</div></div>
    <div class="dual-grid">${renderEmailTable(camps)}${renderLinkedinTable(camps)}</div>
    <div class="section-header"><div class="section-title">Engajamento dos leads</div></div>
    ${renderLeadStatus(camps)}
    <div class="note">Pra acompanhar uma campanha nova, adicione <span class="mono">{ "id", "label" }</span> em <span class="mono">lemlist-campaigns.json</span> — o próximo sync já traz os dados dela, sem mexer em código.</div>
    ${renderFooter()}
  </div>`;

  document.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',()=>{F.campaign=b.dataset.cid;render()}));
}

async function main(){
  try{
    const [data,config]=await Promise.all([
      fetch(`lemlist-data.json?t=${Date.now()}`).then(r=>r.json()),
      fetch('lemlist-campaigns.json').then(r=>r.json()),
    ]);
    gData=data;gConfig=config;render();
  }catch(err){
    document.getElementById('root').innerHTML=`<div class="app"><div class="state-screen"><div class="title serif">Não foi possível carregar</div><div class="sub">${err.message}</div><button class="retry-btn" onclick="location.reload()">Tentar de novo</button></div></div>`;
  }
}
main();
setInterval(()=>main(),15*60*1000);
</script>
</body>
</html>
